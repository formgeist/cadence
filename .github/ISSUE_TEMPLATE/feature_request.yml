name: Feature request
description: Suggest something Cadence should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cadence has a point of view — a native macOS FLAC player where the
        design is the product, not a reskin of iTunes. Proposals that fit that
        are easier to land than ones that pull against it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What can't you do today, or what's awkward? Describe the situation,
        not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you imagine it working, and where it would live in the interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why this one is better.
    validations:
      required: false
  - type: dropdown
    id: help
    attributes:
      label: Are you willing to work on this?
      options:
        - "Yes, if it's a direction the project wants"
        - "Maybe, with guidance"
        - "No, just proposing it"
    validations:
      required: false
